[project]
name = "tupase-mcp"
version = "0.1.1"
description = "Cliente MCP no oficial para Tupase: busca, reserva y cancela actividades desde Claude."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "mcp>=1.10,<2",
  "httpx>=0.27",
  "keyring>=25",
  "platformdirs>=4",
]

[project.scripts]
tupase-mcp = "tupase_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tupase_mcp"]

[tool.hatch.build.targets.sdist]
exclude = [".superpowers", "uv.lock", "docs/plans"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.6"]

[tool.ruff]
line-length = 100
extend-exclude = ["docs", ".superpowers"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
